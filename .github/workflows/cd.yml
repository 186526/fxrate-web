# 发布 Docker 镜像：仅在 release tag（v*）发布时构建，镜像 tag 用版本号。
# push main 不再触发构建——开发环境用 CI 检查保证质量，发版走 GitHub Release。
# Phase 6 发布门禁（两阶 smoke，发布镜像必须是被 smoke 过的同一构建产物）：
#   1. gates：reusable CI（typecheck/lint/unit test/build）任一失败即红。
#   2. 构建发布镜像（push:false + load；无 FXRATE_PROXY build-arg → 生产默认代理）。
#   3. Tier-1 exact smoke（确定性，零真实上游）：启动「精确发布镜像」验证运行时核心
#      输出（前端 / + 应用根内容 + 容器存活）；只验契约形状，不等真实银行就绪。
#   4. Tier-2 contract smoke（契约镜像，不发布）：单独构建带 --build-arg FXRATE_PROXY
#      指向 smoke 后端的镜像对，验证构建期代理机制（/api/fxrate → smoke 后端），
#      证明 build-arg 生效；绝不把内部 smoke hostname 烤进发布镜像。
#   5. push：对本地 daemon 中已被 Tier-1 smoke 的同一批 tag 逐个 `docker push`——
#      只推精确测试过的构建产物，绝不重新构建。
# concurrency 按 ref 串行：release: published 与 push: tags v* 同 ref 并发时不竞态。
name: Create and publish a Docker image

on:
  release:
    types: [published]
  push:
    tags:
      - "v*"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  RELEASE_PROXY: https://fxrate.sunoaki.net/v1/jsonrpc

jobs:
  gates:
    uses: ./.github/workflows/ci.yml
    secrets:
      FXRATE_SUBMODULE_TOKEN: ${{ secrets.FXRATE_SUBMODULE_TOKEN }}

  build-smoke-push:
    runs-on: ubuntu-latest
    needs: gates
    # 最小权限：contents read（checkout）+ packages write（push）+ attestation 所需。
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          submodules: recursive
          token: ${{ secrets.FXRATE_SUBMODULE_TOKEN }}

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.15.0
          cache: yarn

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Verify release tag and prepare build metadata
        id: release
        shell: bash
        run: |
          set -euo pipefail
          package_version=$(node -p "require('./package.json').version")
          tag_version=${GITHUB_REF_NAME#v}
          if [[ "$tag_version" != "$package_version" ]]; then
            echo "::error::release tag $GITHUB_REF_NAME does not match package.json version $package_version" >&2
            exit 1
          fi
          echo "build_id=$GITHUB_SHA" >> "$GITHUB_OUTPUT"
          echo "build_time=$(date --utc --iso-8601=seconds)" >> "$GITHUB_OUTPUT"

      - name: Log in to the Container registry
        uses: docker/login-action@65b78e6e13532edd9afa3aa52ac7964289d1a9c1
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@9ec57ed1fcdbf14dcef7dfbe97b2010124a938b7
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          # release tag -> :0.1.0 + :0.1 + :sha-<short>；非预发布 v*（无 '-'）额外 :latest。
          # 预发布（v0.1.0-rc.1 含 '-'）不覆盖 latest。
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') && !contains(github.ref, '-') }}

      # GHA cache export（--cache-to type=gha）需要 docker-container 驱动：
      # runner 默认 docker 驱动会报 "Cache export is not supported for the docker driver"
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
        with:
          driver: docker-container

      # 只构建不推送（load 进本地 daemon 供 Tier-1 smoke），Tier-1 通过后对同一批 tag
      # 逐个 docker push——同一构建产物，绝不二次构建。cache-from/to 加速热 runner 复建。
      - name: Build release image (no push)
        id: build
        uses: docker/build-push-action@f2a1d5e99d037542a71f64918e516c093c6f3fc4
        with:
          context: .
          push: false
          load: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            FXBUILD_ID=${{ steps.release.outputs.build_id }}
            FXBUILD_TIME=${{ steps.release.outputs.build_time }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Tier-1：精确发布镜像的确定性运行时 smoke（启动 + 前端 / + 应用根内容）。
      - name: Smoke exact release image (deterministic, no live banks)
        run: |
          RELEASE_TAG=$(printf '%s\n' '${{ steps.meta.outputs.tags }}' | head -n1)
          bash scripts/image-smoke.sh --exact --image "$RELEASE_TAG" --expected-proxy "$RELEASE_PROXY"

      # Tier-2：契约镜像（不发布）证明 FXRATE_PROXY build-arg 代理机制，含后端契约、
      # /metrics、JSON-RPC 与 /api/fxrate → smoke 后端全链路。
      - name: Smoke build-arg proxy contract image (not published)
        run: bash scripts/image-smoke.sh

      # 推送被 Tier-1 smoke 过的精确 tag（本地 daemon 内同一产物），不重新构建。
      - name: Push exact smoke-tested image
        id: push
        run: |
          set -euo pipefail
          FIRST_TAG=$(printf '%s\n' '${{ steps.meta.outputs.tags }}' | head -n1)
          for tag in $(printf '%s\n' '${{ steps.meta.outputs.tags }}'); do
            docker push "$tag"
          done
          digest=$(docker inspect --format='{{index .RepoDigests 0}}' "$FIRST_TAG" | sed 's/^.*@//')
          [ -n "$digest" ] || { echo "::error::failed to resolve pushed digest" >&2; exit 1; }
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"

      # This step generates an artifact attestation for the image, which is an unforgeable statement about where and how it was built. It increases supply chain security for people who consume the image. For more information, see "[AUTOTITLE](/actions/security-guides/using-artifact-attestations-to-establish-provenance-for-builds)."
      - name: Generate artifact attestation
        uses: actions/attest-build-provenance@ef244123eb79f2f7a7e75d99086184180e6d0018 # v1
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME}}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
