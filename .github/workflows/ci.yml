# CI 门禁：类型检查 + 非变更性 lint + 单元测试 + 生产构建。
# 前端类型错误/ESLint 错误不阻塞 next build（next.config.mjs 的 ignoreBuildErrors/
# ignoreDuringBuilds 为构建提速），故四道门禁在 CI 显式独立跑，任一失败即红。
name: CI

on:
  push:
    branches: ['**']
  pull_request:
  # Phase 6 发布门禁：CD workflow 以 reusable workflow 方式调用本 CI，
  # 保证 tag/release 发版前必须通过同一组 typecheck/lint/test/build 门禁。
  workflow_call:

jobs:
  gates:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # tsc resolves imports from the lib/fxrate submodule.
          submodules: recursive

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: yarn

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Type check
        run: npx tsc --noEmit

      # 非变更性 lint：package.json 的 lint 脚本是 `eslint .`（无 --fix），直接复用。
      - name: Lint
        run: yarn lint

      - name: Unit tests
        run: yarn test

      - name: Build
        run: yarn build
